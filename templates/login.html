{% extends "base.html" %}
{% block title %}Sign In — CampusGPT{% endblock %}
{% block body_class %}auth-page{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center align-items-center min-vh-75">
    <div class="col-md-7 col-lg-5">
      <div class="card auth-card border-0 shadow-lg">
        <div class="card-body p-4 p-md-5">
          <div class="text-center mb-4">
            <div class="auth-icon mx-auto mb-3">
              <i class="bi bi-mortarboard-fill"></i>
            </div>
            <h1 class="h3 fw-bold mb-1">Welcome back to CampusGPT</h1>
            <p class="text-muted small mb-0">
              Your AI-powered university study &amp; research workspace
            </p>
          </div>

          <form method="POST" action="{{ url_for('login') }}" novalidate>
            <div class="mb-3">
              <label for="identifier" class="form-label fw-semibold">Username or Email</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person"></i></span>
                <input
                  type="text"
                  class="form-control"
                  id="identifier"
                  name="identifier"
                  placeholder="student@university.edu"
                  value="{{ identifier or '' }}"
                  required
                  autofocus
                />
              </div>
            </div>

            <div class="mb-4">
              <label for="password" class="form-label fw-semibold">Password</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input
                  type="password"
                  class="form-control"
                  id="password"
                  name="password"
                  placeholder="Enter your password"
                  required
                />
              </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
              <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
            </button>
          </form>

          <hr class="my-4" />
          <p class="text-center text-muted small mb-0">
            New to CampusGPT?
            <a href="{{ url_for('register') }}" class="fw-semibold text-decoration-none">Create an account</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
